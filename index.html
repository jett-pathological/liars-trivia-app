<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Trivia Host</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="editor">

    <header id="editorHeader">
      <h1>Liar's Trivia Host Panel</h1>
      <div id="editorHeaderActions">
        <button id="fullscreenBtn">Fullscreen</button>
      </div>
    </header>

    <div id="editorLayout">

      <!-- Left sidebar -->
      <aside id="editorSidebar">

        <div class="sidebar-section">
          <h3>Game Style</h3>

          <div class="settingCard" id="questionCountRow">
            <label class="settingCardLabel">Number of questions</label>
            <div class="settingCountWrap">
              <button class="settingCountBtn" id="questionCountMinus">−</button>
              <span id="questionCountVal">8</span>
              <button class="settingCountBtn" id="questionCountPlus">+</button>
            </div>
          </div>

          <div class="settingRow">
            <label class="settingToggle">
              <input type="checkbox" id="toggleAnswerOptions">
              <span class="settingToggleTrack"><span class="settingToggleThumb"></span></span>
              Answer Options Mode
            </label>
          </div>

          <div class="settingCard" id="answerCountRow">
            <label class="settingCardLabel">Options per question</label>
            <div class="settingCountWrap">
              <button class="settingCountBtn" id="answerCountMinus">−</button>
              <span id="answerCountVal">4</span>
              <button class="settingCountBtn" id="answerCountPlus">+</button>
            </div>
          </div>

          <button id="startTrivia" class="sidebarBtn sidebarBtnFilled">Start Trivia</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebarSectionHeader">
            <h3>Keyboard Shortcuts</h3>
            <span class="sidebarEditLink" id="shortcutEditBtn">Edit</span>
          </div>
          <p id="updateNotice" style="display:none;">New weekly trivia available</p>
          <ul class="shortcutList" id="shortcutList"></ul>
          <button class="shortcutResetBtn" id="shortcutResetBtn">Reset to Default</button>
        </div>

        <div class="sidebar-section">
          <h3>Display Settings</h3>

          <div class="settingRow">
            <label class="settingToggle">
              <input type="checkbox" id="toggleBWMode">
              <span class="settingToggleTrack"><span class="settingToggleThumb"></span></span>
              Black & White Mode
            </label>
          </div>

          <div class="settingRow">
            <label class="settingToggle">
              <input type="checkbox" id="togglePromos" checked>
              <span class="settingToggleTrack"><span class="settingToggleThumb"></span></span>
              Show Promo Slides
            </label>
          </div>

          <div class="settingRow">
            <label class="settingToggle">
              <input type="checkbox" id="toggleTutorials" checked>
              <span class="settingToggleTrack"><span class="settingToggleThumb"></span></span>
              Show Tutorial Slides
            </label>
          </div>

          <div class="settingRow" id="bonusPromoRow" style="display:none;">
            <label class="settingToggle">
              <input type="checkbox" id="toggleBonusPromo" checked>
              <span class="settingToggleTrack"><span class="settingToggleThumb"></span></span>
              Show Bonus Promo
            </label>
          </div>
        </div>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-section">
          <button id="printSheetsBtn" class="sidebarBtn sidebarBtnBezeled">Print Answer Sheets</button>
        </div>

      </aside>

      <!-- Right side question editor -->
      <main id="editorFields">
        <div id="questionListHeader">
          <div id="questionListHeaders">
            <span class="qheader qheader-round">Round</span>
            <span class="qheader qheader-cat">Category</span>
            <span class="qheader qheader-question">Question</span>
          </div>
          <div id="questionListActions">
            <button id="saveQuestionsBtn" class="headerActionBtn">Save Questions as File</button>
            <button id="uploadQuestionsBtn" class="headerActionBtn">Upload File</button>
            <button id="resetWeekly" class="headerActionBtn headerActionBtnPrimary">Reset to Weekly Questions</button>
            <input type="file" id="uploadQuestionsInput" accept=".csv" style="display:none">
          </div>
        </div>
      </main>

    </div>

  </div>

  <div id="presentation" style="display:none">
    <!-- Control Buttons -->
    <button id="backBtn" class="top-left">Main Menu</button>
    <button id="fullscreenBtnPresentation" class="top-right">Fullscreen</button>
    <button id="slideLeftBtn" class="side-nav side-nav-left">◀</button>
    <button id="slideRightBtn" class="side-nav side-nav-right">▶</button>

    <!-- Slide Content -->
    <div id="slide"></div>

    <!-- Timer Bar -->
    <div id="timerBarContainer">
      <div id="timerTextBg">30 SECONDS</div>
      <div id="timerBar">
        <div id="timerText">30 SECONDS</div>
      </div>
    </div>
  </div>

  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
